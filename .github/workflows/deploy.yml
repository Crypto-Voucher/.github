name: Build and Push

# Reusable build workflow for services deployed by GitOps. Builds the
# service's Docker image, pushes it to ECR and GHCR, and notifies Telegram.
# Image promotion and Kubernetes deployment are handled separately through
# the GitOps repository and Argo CD.
#
# Triggers live in the per-service wrapper (push to stage branch, push of
# v* tag, etc.) — this workflow only takes `environment` as input and
# behaves accordingly.
#
# Required org secrets (org-level or repo-level):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#
# Required org variables:
#   AWS_DEPLOY_ROLE_ARN — OIDC role with ECR push + EKS access.

on:
  workflow_call:
    secrets:
      GITOPS_APP_ID:
        required: false
      GITOPS_APP_KEY:
        required: false
    inputs:
      environment:
        description: stage | prod
        required: true
        type: string
      service_name:
        description: Service name used in the image summary and Telegram message.
        required: true
        type: string
      ecr_repository:
        description: ECR image repo name (without the registry URL).
        required: true
        type: string
      aws_region:
        required: false
        type: string
        default: eu-central-1
      build_arg_vars:
        description: |
          Space/newline-separated names of Actions Variables to forward as
          `docker build --build-arg NAME=<value>`. Values are read from THIS
          job's environment scope (inputs.environment), so per-environment
          stage/prod values resolve correctly — the caller job cannot, since a
          reusable-workflow caller may not declare `environment:`.
          Use for build-time vars baked into the image (e.g. Vue CLI VUE_APP_*
          inlined into the JS bundle at `npm run build`).
        required: false
        type: string
        default: ""
      gitops_app_dir:
        description: |
          Katalog serwisu w repo gitops (apps/<dir>/stage/values.yaml).
          Domyślnie równy ecr_repository — pokrywa się dla cv-api,
          wallet-api-v2, notification-api itd.
        required: false
        type: string
        default: ""
      gitops_enabled:
        description: Ustaw false dla serwisów spoza gitopsa.
        required: false
        type: boolean
        default: true
    outputs:
      image_tag:
        value: ${{ jobs.build-and-push.outputs.image_tag }}

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  build-and-push:
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    runs-on:
      - self-hosted
      - linux
      - eks-access
      - ${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine image tag
        id: image
        shell: bash
        run: echo "tag=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}
            ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag

      # Resolve the requested Actions Variables from this job's environment
      # scope into KEY=VALUE lines for docker build-args. Runs here (not in the
      # caller) because environment-scoped vars are only available in a job that
      # declares `environment:`.
      - name: Compose build args
        id: build_args
        env:
          ALL_VARS: ${{ toJSON(vars) }}
          FORWARD: ${{ inputs.build_arg_vars }}
        run: |
          {
            echo 'value<<__BUILD_ARGS_EOF__'
            for name in $FORWARD; do
              printf '%s=%s\n' "$name" "$(jq -r --arg k "$name" '.[$k] // ""' <<<"$ALL_VARS")"
            done
            echo '__BUILD_ARGS_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: ${{ steps.build_args.outputs.value }}
          # BuildKit secret for repos whose Dockerfile installs private
          # @crypto-voucher packages from GitHub Packages. Consumed with
          #   RUN --mount=type=secret,id=github_token ...
          # so the token never lands in an image layer or `docker history`.
          # Unlike build-args this is not baked into the image; harmless for
          # Dockerfiles that don't mount it.
          secrets: |
            github_token=${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish image summary
        shell: bash
        run: |
          echo "## Published image" >> "$GITHUB_STEP_SUMMARY"
          echo "- Service: ${{ inputs.service_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Environment: ${{ inputs.environment }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${{ steps.image.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ECR: \`${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}:${{ steps.image.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="✅ Image build successful!"
          if [[ "${{ job.status }}" != "success" ]]; then
            STATUS="❌ Image build failed!"
          fi

          ENV_LABEL="🌍 ${{ inputs.environment }}"
          if [[ "${{ inputs.environment }}" == "prod" ]]; then
            ENV_LABEL="🚨 PRODUCTION 🚨"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="-${TG_CHAT}" \
            -d text="${ENV_LABEL} | ${STATUS}

          Repo: ${{ github.repository }}
          Service: ${{ inputs.service_name }}
          Environment: ${{ inputs.environment }}
          Image: ${{ steps.image.outputs.tag }}
          Triggered by: ${{ github.actor }}"

  bump-gitops:
    needs: build-and-push
    if: inputs.environment == 'stage' && inputs.gitops_enabled
    runs-on:
      - self-hosted
      - linux
      - eks-access
      - ${{ inputs.environment }}
    permissions:
      contents: read
    concurrency:
      group: gitops-write-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Mint GitHub App token for gitops repo
        id: token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GITOPS_APP_ID }}
          private-key: ${{ secrets.GITOPS_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: gitops

      - name: Checkout gitops
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/gitops
          token: ${{ steps.token.outputs.token }}
          path: gitops

      - name: Bump image tag
        working-directory: gitops
        env:
          TAG: ${{ needs.build-and-push.outputs.image_tag }}
          APP_DIR: ${{ inputs.gitops_app_dir != '' && inputs.gitops_app_dir || inputs.ecr_repository }}
        run: |
          set -euo pipefail
          FILE="apps/${APP_DIR}/stage/values.yaml"
          
          test -f "$FILE" || { echo "::error::$FILE nie istnieje w repo gitops"; exit 1; }
          
          # Dokładnie jedna linia `  tag:` na drugim poziomie wcięcia (image.tag).
          MATCHES=$(grep -cE '^  tag: ' "$FILE" || true)
          if [[ "$MATCHES" != "1" ]]; then
            echo "::error::Oczekiwano 1 linii 'tag:' w $FILE, znaleziono $MATCHES"
            exit 1
          fi
          
          CURRENT=$(grep -E '^  tag: ' "$FILE" | sed -E 's/^  tag: "?([^"]*)"?/\1/')
          if [[ "$CURRENT" == "$TAG" ]]; then
            echo "Tag już ustawiony na $TAG, nic do zrobienia."
            exit 0
          fi
          
          sed -i -E "s|^(  tag: ).*|\\1\"${TAG}\"|" "$FILE"
          git diff --stat
          
          git config user.name  "gitops-bot[bot]"
          git config user.email "gitops-bot[bot]@users.noreply.github.com"
          git add "$FILE"
          git commit -m "chore(${APP_DIR}/stage): image ${TAG}" \
                     -m "Source: ${{ github.repository }}@${{ github.sha }}"
          
          # Inne serwisy pushują do tego samego repo równolegle — concurrency
          # jest per-repo, więc kolizje między repo są normalne.
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            sleep $(( (RANDOM % 5) + 2 ))
            git pull --rebase --autostash
          done
          echo "::error::Nie udało się wypchnąć po 5 próbach"
          exit 1

      - name: Summary
        if: success()
        run: |
          echo "- GitOps: \`apps/${{ inputs.gitops_app_dir != '' && inputs.gitops_app_dir || inputs.ecr_repository }}/stage/values.yaml\` → \`${{ needs.build-and-push.outputs.image_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
