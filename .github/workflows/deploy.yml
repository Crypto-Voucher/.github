name: Build, Push & Deploy

# Reusable deploy workflow. Builds the service's Docker image, pushes to
# ECR + GHCR, runs `helm upgrade` against the EKS cluster matching the
# `environment` input, then notifies Telegram.
#
# Triggers live in the per-service wrapper (push to stage branch, push of
# v* tag, etc.) — this workflow only takes `environment` as input and
# behaves accordingly.
#
# Required org secrets (org-level or repo-level):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
#
# Required org variables:
#   AWS_DEPLOY_ROLE_ARN — OIDC role with ECR push + EKS access.

on:
  workflow_call:
    inputs:
      environment:
        description: stage | prod
        required: true
        type: string
      service_name:
        description: Helm release name and Telegram message header.
        required: true
        type: string
      ecr_repository:
        description: ECR image repo name (without the registry URL).
        required: true
        type: string
      helm_chart_version:
        description: Version of the shared `microservice` chart pulled from ECR OCI registry.
        required: true
        type: string
      eks_cluster:
        description: EKS cluster name, e.g. cv-cluster-stage.
        required: true
        type: string
      k8s_namespace:
        description: Target namespace, e.g. risk-api-stage.
        required: true
        type: string
      values_file:
        description: Path inside the service repo to the env-specific values.yaml.
        required: true
        type: string
      aws_region:
        required: false
        type: string
        default: eu-central-1
      build_arg_vars:
        description: |
          Space/newline-separated names of Actions Variables to forward as
          `docker build --build-arg NAME=<value>`. Values are read from THIS
          job's environment scope (inputs.environment), so per-environment
          stage/prod values resolve correctly — the caller job cannot, since a
          reusable-workflow caller may not declare `environment:`.
          Use for build-time vars baked into the image (e.g. Vue CLI VUE_APP_*
          inlined into the JS bundle at `npm run build`).
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  deploy:
    runs-on:
      - self-hosted
      - linux
      - eks-access
      - ${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.login-ecr.outputs.registry }}/${{ inputs.ecr_repository }}
            ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag

      # Resolve the requested Actions Variables from this job's environment
      # scope into KEY=VALUE lines for docker build-args. Runs here (not in the
      # caller) because environment-scoped vars are only available in a job that
      # declares `environment:`.
      - name: Compose build args
        id: build_args
        env:
          ALL_VARS: ${{ toJSON(vars) }}
          FORWARD: ${{ inputs.build_arg_vars }}
        run: |
          {
            echo 'value<<__BUILD_ARGS_EOF__'
            for name in $FORWARD; do
              printf '%s=%s\n' "$name" "$(jq -r --arg k "$name" '.[$k] // ""' <<<"$ALL_VARS")"
            done
            echo '__BUILD_ARGS_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          build-args: ${{ steps.build_args.outputs.value }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name ${{ inputs.eks_cluster }} --region ${{ inputs.aws_region }}

      - name: Create namespace if not exists
        run: |
          kubectl create namespace ${{ inputs.k8s_namespace }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Helm
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="sha-$SHORT_SHA"

          echo "📦 Deploying image tag: $IMAGE_TAG"
          echo "📋 Using values file: ${{ inputs.values_file }}"
          echo "🎯 Target namespace: ${{ inputs.k8s_namespace }}"

          aws ecr get-login-password --region ${{ inputs.aws_region }} | \
          helm registry login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}

          helm upgrade --install ${{ inputs.service_name }} \
            oci://${{ steps.login-ecr.outputs.registry }}/charts/microservice \
            --version ${{ inputs.helm_chart_version }} \
            --namespace ${{ inputs.k8s_namespace }} \
            --values ${{ inputs.values_file }} \
            --set image.tag=$IMAGE_TAG \
            --wait \
            --timeout 5m

          echo "✅ Deployment complete!"

      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="✅ Deployment successful!"
          if [[ "${{ job.status }}" != "success" ]]; then
            STATUS="❌ Deployment failed!"
          fi

          ENV_LABEL="🌍 ${{ inputs.environment }}"
          if [[ "${{ inputs.environment }}" == "prod" ]]; then
            ENV_LABEL="🚨 PRODUCTION 🚨"
          fi

          curl -s -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="-${TG_CHAT}" \
            -d text="${ENV_LABEL} | ${STATUS}

          Repo: ${{ github.repository }}
          Service: ${{ inputs.service_name }}
          Environment: ${{ inputs.environment }}
          Image: sha-$(git rev-parse --short HEAD)
          Triggered by: ${{ github.actor }}"
