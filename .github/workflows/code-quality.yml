name: Code Quality

# Reusable Node.js lint + unit tests. Reads Node version from `.nvmrc` in
# the service repo. Override `test_command`/`lint_command` if the service
# diverges from `npm run lint` / `npm test`.
#
# For non-Node stacks, either fork this workflow per language or extend it
# with language input (see risk_api -> templates/README.md).

on:
  workflow_call:
    inputs:
      node_version_file:
        required: false
        type: string
        default: '.nvmrc'
      lint_command:
        required: false
        type: string
        default: 'npm run lint'
      test_command:
        required: false
        type: string
        default: 'npm test'
      runs_on:
        description: >-
          JSON list of runner labels. Defaults to the self-hosted CI pool
          (gmc_iac/github-runners-v2); pass '["ubuntu-latest"]' to fall back
          to GitHub-hosted runners.
        required: false
        type: string
        default: '["self-hosted", "linux", "x64", "ci"]'

jobs:
  lint-and-test:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ${{ inputs.node_version_file }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          # Service repos that consume private @crypto-voucher packages from
          # GitHub Packages ship an .npmrc with
          #   //npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}
          # npm expands that from the environment, so the token has to be here
          # or `npm ci` 401s. GH_PACKAGES_TOKEN (org secret, read:packages) is
          # preferred because the job token only reaches packages published
          # from the same repo; it falls back to the job token when unset.
          GITHUB_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Lint
        run: ${{ inputs.lint_command }}

      - name: Test
        run: ${{ inputs.test_command }}
